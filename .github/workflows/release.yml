name: Release

# Signed + notarized zip. Same Apple secrets as dripnex/app:
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.2.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Stamp version from tag
        id: ver
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" > version.env
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate widget project
        run: xcodegen generate

      - name: Import Developer ID
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: ./Scripts/import_signing_cert.sh

      - name: Package, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_NOTARIZE: '1'
          UNIVERSAL: '1'
        run: ./Scripts/package_app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/Airtime-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "$zip" --title "Airtime ${VERSION}" --generate-notes
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevWifiBar
          path: |
            dist/DevWifiBar.app
            dist/DevWifiBar-*.zip
          if-no-files-found: error
          retention-days: 30
